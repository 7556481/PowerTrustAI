<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerTrustAI · 电力知识问答</title><link rel="icon" href="/ui/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/ui/style.css"><script src="/ui/connection_memory.js" defer></script><script src="/ui/app.js" defer></script></head>
<body><header><a class="brand" href="/"><img src="/ui/mark.svg" alt=""><span>PowerTrustAI</span></a><nav><a href="#history-panel" id="history-open">历史</a><details class="service-menu"><summary id="connection-state">未连接</summary><button id="service-check" type="button" class="quiet">重新检查服务</button><button id="disconnect" type="button" class="quiet">注销连接</button></details></nav></header>
<main class="question-page"><section class="intro"><h1>电力知识问答</h1><p>根据电力资料回答问题，并自动核对回答与依据。</p><small id="service-mode" role="status">正在查询服务模式…</small></section>
<p id="service-status" class="notice" role="status"></p><p id="notice" class="notice" role="status" aria-live="polite"></p>
<section class="panel composer"><form id="submit-form"><label for="question">你想了解什么？</label><textarea id="question" rows="4" maxlength="8000" required placeholder="例如：无功功率和电压有什么关系？"></textarea><div class="section-head"><button id="example-question" type="button" class="quiet">填入概念示例</button><button id="submit" type="submit" class="primary" disabled>生成并审核</button></div></form></section>
<section class="panel answer-panel"><div class="section-head"><h2>回答</h2><div class="inline"><button id="refresh" type="button" class="quiet" disabled>查询状态</button><button id="cancel" type="button" class="quiet" disabled>取消</button></div></div><p id="phase" role="status">输入问题后，回答将在这里展示。</p><p id="run-status-note" class="notice error" role="status" hidden></p><div id="answers"></div><div id="decision"></div><section id="evidence-panel" hidden><h3>引用依据</h3><div id="evidence-detail"></div></section></section>
<details id="history-panel" class="panel"><summary>历史记录</summary><p class="hint">只读取已保存结果，不重新执行。</p><button id="history-refresh" type="button" class="quiet">刷新列表</button><div id="history" class="history"></div><button id="history-next" type="button" class="quiet" hidden>下一页</button></details>
<footer>回答供资料理解参考，不替代现场工程判断。<a id="diagnostics-link" href="/ui/diagnostics.html">诊断</a></footer></main></body></html>
