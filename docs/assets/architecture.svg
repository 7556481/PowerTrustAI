<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc">
<title id="title">PowerTrustAI 问答与双审流程</title>
<desc id="desc">问题经过 SQLite 检索、生成初稿和主张提取后，进入事实与领域双审。满足有据修订资格且尚未修订时最多修订一次；新版重新提取并完整双审，否则交付正文与审核状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs>
<rect width="360" height="600" rx="8" fill="#fff"/>
<style>text{font-family:system-ui,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328;font-size:16px;text-anchor:middle}.box{fill:#f0f6fc;stroke:#7690ae;stroke-width:1.3}.edge{fill:none;stroke:#52647a;stroke-width:1.5;marker-end:url(#arrow)}.label{font-size:15px}</style>
<path class="edge" d="M180 44 V65"/>
<path class="edge" d="M180 109 V130"/>
<path class="edge" d="M180 170 V191"/>
<path class="edge" d="M180 231 V251 H90 V272"/>
<path class="edge" d="M180 251 H270 V272"/>
<path class="edge" d="M90 328 V350 H180 V373"/>
<path class="edge" d="M270 328 V350 H180"/>
<path class="edge" d="M140 417 V449 H90 V474"/>
<path class="edge" d="M220 417 V449 H270 V474"/>
<path class="edge" d="M270 530 V562 H350 V211 H290"/>
<rect x="105" y="10" width="150" height="34" rx="7" class="box"/>
<text x="180.0" y="33.0">问题</text>
<rect x="70" y="65" width="220" height="44" rx="7" class="box"/>
<text x="180.0" y="93.0">SQLite 检索证据</text>
<rect x="70" y="130" width="220" height="40" rx="7" class="box"/>
<text x="180.0" y="156.0">生成初稿</text>
<rect x="70" y="191" width="220" height="40" rx="7" class="box"/>
<text x="180.0" y="217.0">提取主张</text>
<rect x="20" y="272" width="140" height="56" rx="7" class="box"/>
<text x="90.0" y="296.0">事实审核</text>
<text x="90.0" y="316.0">回答与引用</text>
<rect x="200" y="272" width="140" height="56" rx="7" class="box"/>
<text x="270.0" y="296.0">领域审核</text>
<text x="270.0" y="316.0">条件与前提</text>
<rect x="80" y="373" width="200" height="44" rx="7" fill="#fff4db" stroke="#7690ae" stroke-width="1.3"/>
<text x="180.0" y="401.0">满足修订条件？</text>
<text class="label" x="94" y="443">否则</text>
<text class="label" x="272" y="440">是，且未修订</text>
<rect x="20" y="474" width="140" height="56" rx="7" class="box"/>
<text x="90.0" y="498.0">交付正文</text>
<text x="90.0" y="518.0">与审核状态</text>
<rect x="200" y="474" width="140" height="56" rx="7" class="box"/>
<text x="270.0" y="498.0">有据修订</text>
<text x="270.0" y="518.0">最多一次</text>
<text class="label" x="180" y="590">新版重新提取，完整双审</text>
</svg>
