name: Tantivy isolated semantics
on:
  pull_request:
    paths:
      - 'evaluation/tantivy_*.py'
      - 'rag/tantivy_*.py'
      - 'backend/assembly.py'
      - 'backend/config.py'
      - 'harness/retrieval.py'
      - 'tests/test_tantivy_query_ast.py'
      - 'requirements-tantivy-prototype.txt'
      - '.github/workflows/tantivy-bounded.yml'
  push:
    branches: ['codex/tantivy-bounded-feasibility-v1', 'codex/tantivy-stability-medium-v2']
jobs:
  semantics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install -r requirements-tantivy-prototype.txt -r requirements-api.lock.txt
      - run: python -m unittest tests.test_tantivy_query_ast -v
      - run: python -c "import tempfile; from pathlib import Path; import evaluation.tantivy_selfcheck as s; s.LOCAL=Path(tempfile.mkdtemp()); s.main()"
      - run: python -m evaluation.tantivy_writer_selfcheck
      - run: python -m evaluation.tantivy_stability_checks_v2
      - run: python -m evaluation.tantivy_supervision_checks_v3
      - run: python -m evaluation.tantivy_product_checks_v1
      - run: python -m evaluation.tantivy_adapter_checks_v1
      - run: python -m evaluation.tantivy_ranking_checks_v1
      - run: python -m evaluation.tantivy_light_score_checks_v1
