name: v27 native asset contract
on:
  push:
    paths:
      - 'evaluation/**fast_overlap*v27.py'
      - 'tests/test_fast_overlap_v27.py'
      - '.github/workflows/fast-overlap-native-v27.yml'
  pull_request:
    paths:
      - 'evaluation/**fast_overlap*v27.py'
      - 'tests/test_fast_overlap_v27.py'
      - '.github/workflows/fast-overlap-native-v27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-payload-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen native test dependency
        run: python -m pip install tantivy==0.27.0
      - name: Old identity payload lookup with SQLite unavailable
        run: python -m unittest evaluation.test_fast_overlap_native_v27 -v
